@for (tile of cardDocs(); track $index; let i = $index) {
    <div
        class="flex flex-col p-2.5 gap-2.5 bg-ink/[.06] rounded-15px"
        [class]="
            activeCardId() === tile.id ? 'border border-solid border-accent bg-accent/[.05]' : ''
        "
        [id]="tile.id"
        #cards>
        <div class="ml-4 flex items-center text-title text-ink uppercase tracking-[.25em]">
            {{ tile.header }}
        </div>

        <div class="flex gap-30px mob:flex-col mob:gap-15px scroll-mt-[185px]" [id]="tile.anchor">
            <div
                class="flex-[55%] rounded-10px bg-full-white border border-ink/[.08] shadow-sm p-15px">
                <div class="flex items-start gap-2.5 mb-5">
                    <img
                        width="20"
                        height="20"
                        [ngSrc]="'hand-box' | asset: openSourceOptionsPath"
                        alt="Hand with box" />
                    <span class="text-span text-ink/[.25]">Usage</span>
                </div>
                @let codeParts = splitCode(tile.code);
                @if (codeParts.setup) {
                    <span class="uppercase tracking-[.25em] text-span text-ink/[.45]"
                        >Provider config</span
                    >
                    <div class="block mt-2.5 mb-15px">
                        <pre class="flex text-span">
                            <code [highlight]="codeParts.setup" language="typescript" class="bg-ink/[.04] border border-ink/[.08] w-full h-fit pl-15px rounded-10px overflow-hidden whitespace-pre-line"></code>
                        </pre>
                    </div>
                }
                <span class="uppercase tracking-[.25em] text-span text-ink/[.45]">Source code</span>
                <div class="block mt-2.5">
                    <pre class="flex text-span">
                        <code [highlight]="codeParts.template" language="html" class="bg-ink/[.04] border border-ink/[.08] w-full h-fit pl-15px rounded-10px overflow-hidden whitespace-pre-line"></code>
                        <img height="18" width="13" [ngSrc]="'input-vector' | asset : openSourceOptionsPath" class="relative right-5 self-center" alt="Input vector" />
                    </pre>
                </div>
            </div>
            <ng-container
                *ngTemplateOutlet="
                    exampleTmpl;
                    context: {
                        $implicit: $safeNavigationMigration(cardExamples()?.[i]),
                        placeholder: tile.header,
                    }
                " />
        </div>
    </div>
}

<ng-template #exampleTmpl let-ex let-placeholder="placeholder">
    <div class="flex-[45%] rounded-10px p-15px bg-ink">
        <ng-container
            *ngTemplateOutlet="
                !ex._pipe ? inputTemplate : pipeTemplate;
                context: { $implicit: ex, placeholder: placeholder }
            " />
    </div>
</ng-template>

<ng-template #inputTemplate let-ex let-placeholder="placeholder">
    <!-- Reactive Forms (FormControl) -->
    <div class="flex flex-col gap-1 mb-2">
        <span class="uppercase tracking-[.10em] text-span text-text-secondary">Reactive Forms</span>
        <input
            [placeholder]="placeholder || ''"
            [placeHolderCharacter]="ex._placholderCharacter || '_'"
            [prefix]="ex._prefix || ''"
            [suffix]="ex._suffix || ''"
            [dropSpecialCharacters]="ex._dropSpecialCharacters ?? true"
            [mask]="ex._mask || ''"
            [thousandSeparator]="ex._thousandSeparator || ' '"
            [allowNegativeNumbers]="ex._allowNegativeNumbers || null"
            [specialCharacters]="ex._specialCharacters || specialCharacters"
            [shownMaskExpression]="ex._shownMaskExpression"
            [formControl]="ex.control.formControl"
            [apm]="ex._apm || false"
            [decimalMarker]="ex._decimalMarker || '.'"
            [typeFromDecimals]="ex._typeFromDecimals || false"
            [defaultValueOnBlur]="ex._defaultValueOnBlur ?? null"
            [leadZero]="ex._leadZero || false"
            [keepCharacterPositions]="ex._keepCharacterPositions || false"
            [validation]="ex._validation || false"
            [showMaskTyped]="ex._showMaskTyped || false"
            [clearIfNotMatch]="ex._clearIfNotMatch"
            [hiddenInput]="ex._hiddenInput || null"
            [outputTransformFn]="ex._outputTransformFn || outputTransformFn"
            [inputTransformFn]="ex._inputTransformFn || inputTransformFn"
            class="w-full h-[51px] placeholder:text-white/25 text-full-white py-3 px-5 outline-none bg-ink border-b-2px border-b-white rounded-10px focus:border-b-accent hover:border-b-accent hover:bg-full-white/25 focus:bg-full-white/25" />
        <ngxd-card-content
            [value]="ex.control.formControl.value | isEmpty"
            title="FormControl:"
            color="accent-view" />
    </div>

    <!-- Template-driven (ngModel) -->
    <div class="flex flex-col gap-1 mb-2">
        <span class="uppercase tracking-[.10em] text-span text-text-secondary"
            >Template-driven</span
        >
        <input
            [placeholder]="placeholder || ''"
            [placeHolderCharacter]="ex._placholderCharacter || '_'"
            [prefix]="ex._prefix || ''"
            [suffix]="ex._suffix || ''"
            [dropSpecialCharacters]="ex._dropSpecialCharacters ?? true"
            [mask]="ex._mask || ''"
            [thousandSeparator]="ex._thousandSeparator || ' '"
            [allowNegativeNumbers]="ex._allowNegativeNumbers || null"
            [specialCharacters]="ex._specialCharacters || specialCharacters"
            [shownMaskExpression]="ex._shownMaskExpression"
            [(ngModel)]="ex.control.model"
            [apm]="ex._apm || false"
            [decimalMarker]="ex._decimalMarker || '.'"
            [typeFromDecimals]="ex._typeFromDecimals || false"
            [defaultValueOnBlur]="ex._defaultValueOnBlur ?? null"
            [leadZero]="ex._leadZero || false"
            [keepCharacterPositions]="ex._keepCharacterPositions || false"
            [validation]="ex._validation || false"
            [showMaskTyped]="ex._showMaskTyped || false"
            [clearIfNotMatch]="ex._clearIfNotMatch"
            [hiddenInput]="ex._hiddenInput || null"
            [outputTransformFn]="ex._outputTransformFn || outputTransformFn"
            [inputTransformFn]="ex._inputTransformFn || inputTransformFn"
            class="w-full h-[51px] placeholder:text-white/25 text-full-white py-3 px-5 outline-none bg-ink border-b-2px border-b-white rounded-10px focus:border-b-accent hover:border-b-accent hover:bg-full-white/25 focus:bg-full-white/25" />
        <ngxd-card-content
            [value]="ex.control.model() | isEmpty"
            title="NgModel:"
            color="accent-view" />
    </div>

    <!-- Signal Forms -->
    <div class="flex flex-col gap-1 mb-2">
        <span class="uppercase tracking-[.10em] text-span text-text-secondary">Signal Forms</span>
        <input
            [placeholder]="placeholder || ''"
            [placeHolderCharacter]="ex._placholderCharacter || '_'"
            [prefix]="ex._prefix || ''"
            [suffix]="ex._suffix || ''"
            [dropSpecialCharacters]="ex._dropSpecialCharacters ?? true"
            [mask]="ex._mask || ''"
            [thousandSeparator]="ex._thousandSeparator || ' '"
            [allowNegativeNumbers]="ex._allowNegativeNumbers || null"
            [specialCharacters]="ex._specialCharacters || specialCharacters"
            [shownMaskExpression]="ex._shownMaskExpression"
            [formField]="ex.control.signalForm.value"
            [apm]="ex._apm || false"
            [decimalMarker]="ex._decimalMarker || '.'"
            [typeFromDecimals]="ex._typeFromDecimals || false"
            [defaultValueOnBlur]="ex._defaultValueOnBlur ?? null"
            [leadZero]="ex._leadZero || false"
            [keepCharacterPositions]="ex._keepCharacterPositions || false"
            [validation]="ex._validation || false"
            [showMaskTyped]="ex._showMaskTyped || false"
            [clearIfNotMatch]="ex._clearIfNotMatch"
            [hiddenInput]="ex._hiddenInput || null"
            [outputTransformFn]="ex._outputTransformFn || outputTransformFn"
            [inputTransformFn]="ex._inputTransformFn || inputTransformFn"
            class="w-full h-[51px] placeholder:text-white/25 text-full-white py-3 px-5 outline-none bg-ink border-b-2px border-b-white rounded-10px focus:border-b-accent hover:border-b-accent hover:bg-full-white/25 focus:bg-full-white/25" />
        <ngxd-card-content
            [value]="ex.control.signalForm.value().value() | isEmpty"
            title="Signal Form:"
            color="accent-view" />
    </div>

    <ngxd-card-content [value]="ex._mask" title="Mask:" color="primary-view" />
</ng-template>

<ng-template #pipeTemplate>
    <ngxd-card-content [value]="phone | mask: '(000) 000-0000'" title="" color="" />
    <ngxd-card-content value="(000) 000-0000" title="Mask:" color="primary-view" />
    <ngxd-card-content value="123456789" title="Value:" color="primary-view" />
</ng-template>
