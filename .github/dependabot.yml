version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: ci
          include: scope
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: chore
          include: scope
      groups:
          minor-and-patch:
              update-types: [minor, patch]
      ignore:
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
