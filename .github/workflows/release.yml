name: release

on:
    push:
        branches:
            - develop

# One release run at a time; never cancel a run that may be publishing.
concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read # no id-token, no write scopes: this job runs dependency code
        outputs:
            version: ${{ steps.pack.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
            - name: Install
              run: bun install --frozen-lockfile
            - name: Build library
              run: bun run build:lib
            - name: Test library
              run: bun run test:lib
            - name: Pack library
              id: pack
              working-directory: dist/ngx-mask-lib
              run: |
                  version=$(bun -p "require('./package.json').version")
                  [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version '$version'"; exit 1; }
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  bun pm pack # ngx-mask-<version>.tgz, same name and contents as npm pack
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: package
                  path: dist/ngx-mask-lib/*.tgz
                  if-no-files-found: error
                  retention-days: 7

    release-please:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write
        steps:
            # Tags the merge commit of a merged Release PR, then opens/updates the Release PR. createReleases reads
            # the default-branch state, not this run's sha, so the tag may come from any run; nothing reads this
            # job's outputs: publish decides from the tag and the registry.
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    publish:
        needs: [build, release-please]
        # Runs even if release-please failed (it may fail after creating the tag); the state step decides.
        if: ${{ !cancelled() && needs.build.result == 'success' }}
        runs-on: ubuntu-latest
        permissions:
            id-token: write # npm trusted publishing (OIDC) + provenance; nothing else, no checkout, no install
        env:
            VERSION: ${{ needs.build.outputs.version }}
        steps:
            - name: Release state (publish the build of the tagged commit, once)
              id: state
              run: |
                  [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version '$VERSION'"; exit 1; }
                  refs=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}")
                  tagged=$(printf '%s\n' "$refs" | tail -n1 | cut -f1) # the commit, also for an annotated tag
                  code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/ngx-mask/$VERSION")
                  if [ "$code" = 200 ]; then
                      echo "publish=false" >> "$GITHUB_OUTPUT" # already on npm: a re-run, or any push after the release
                  elif [ "$code" != 404 ]; then
                      echo "registry answered $code"; exit 1
                  elif [ "$tagged" = "$GITHUB_SHA" ]; then
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                  elif [ -n "$tagged" ]; then
                      echo "::error::v$VERSION is tagged at $tagged but not on npm: re-run all jobs of the release run for $tagged"; exit 1
                  else
                      echo "::error::$VERSION is neither tagged nor on npm: read the release-please job log, then re-run all jobs"; exit 1
                  fi
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              if: steps.state.outputs.publish == 'true'
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - name: npm supports trusted publishing (>= 11.5.1)
              if: steps.state.outputs.publish == 'true'
              run: |
                  v=$(npm -v)
                  test "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" = 11.5.1 || { echo "npm $v is older than 11.5.1"; exit 1; }
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              if: steps.state.outputs.publish == 'true'
              with:
                  name: package
                  path: package
            - name: Publish to npm
              if: steps.state.outputs.publish == 'true'
              # npm, not bun, on purpose: trusted publishing (OIDC) + provenance need npm CLI >= 11.5.1; bun publish has no OIDC
              run: npm publish "package/ngx-mask-${VERSION}.tgz"
