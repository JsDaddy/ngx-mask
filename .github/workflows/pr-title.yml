name: pr title

on:
    pull_request: # NOT pull_request_target: fork PRs get a read-only token and no secrets
        branches:
            - develop
        types: [opened, edited, synchronize, reopened]

concurrency:
    group: pr-title-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint-title:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
            - run: bun install --frozen-lockfile --ignore-scripts
            - name: Lint PR title with the repo commitlint config
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }} # env var, never interpolated into the script
              run: printf '%s\n' "$PR_TITLE" | bunx commitlint
